<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexus · 灵 · 前端预览</title>
<script>
try {
  var savedPreview = JSON.parse(localStorage.getItem('nexus-preview-v1') || 'null');
  if (savedPreview) {
    if (savedPreview.theme === 'night') document.documentElement.dataset.theme = 'night';
    var pal = savedPreview.palette;
    if (pal === 'blue') pal = 'cool';
    else if (pal && pal !== 'jade' && pal !== 'cool') pal = 'jade';
    if (pal) document.documentElement.dataset.palette = pal;
    if (savedPreview.motion) document.documentElement.dataset.motion = savedPreview.motion;
  }
} catch (e) {}
</script>

<!-- 背景气场：随状态缓慢变色 -->
<div class="aura" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><b class="grain"></b></div>

<div class="island-scrim" id="island-scrim" hidden></div>

<!-- 灵岛：后台工作、通知、详情都在这一处形变 -->
<section class="island" id="island" data-mode="compact" aria-label="灵岛：后台工作与通知"><div class="island-inner" id="island-inner"></div></section>

<!-- 导航坞 -->
<nav class="dock" id="dock" aria-label="主导航">
 <span class="dock-ink" id="dock-ink" aria-hidden="true"></span>
 <button class="dock-btn active" data-view="chat" aria-label="主交流" data-tip="主交流  ⌘1"><svg class="i"><use href="#i-chat"/></svg></button>
 <button class="dock-btn" data-view="work" aria-label="工作" data-tip="工作  ⌘2"><svg class="i"><use href="#i-work"/></svg><i class="dock-badge" id="dock-work-badge" hidden></i></button>
 <button class="dock-btn" data-view="context" aria-label="上下文" data-tip="上下文  ⌘3"><svg class="i"><use href="#i-layers"/></svg></button>
 <button class="dock-btn" data-view="skills" aria-label="技能" data-tip="技能  ⌘4"><svg class="i"><use href="#i-spark"/></svg></button>
 <button class="dock-btn" data-view="plugins" aria-label="插件" data-tip="插件  ⌘5"><svg class="i"><use href="#i-plug"/></svg></button>
 <span class="dock-gap"></span>
 <button class="dock-btn" data-view="settings" aria-label="设置" data-tip="设置  ⌘6"><svg class="i"><use href="#i-tune"/></svg></button>
 <span class="dock-owner" title="所有者 · 本地预览">L</span>
</nav>
<button class="menu-btn" id="menu-btn" aria-label="打开导航" aria-expanded="false"><svg class="i"><use href="#i-menu"/></svg></button>

<!-- 预览控制（不属于产品界面） -->
<div class="preview-ctl" id="preview-ctl">
 <span class="pc-tag">预览</span>
 <button class="pc-scene" id="scene-btn" aria-haspopup="menu" aria-expanded="false"><span id="scene-label">交流</span><svg class="i xs"><use href="#i-down"/></svg></button>
 <button class="pc-theme" id="theme-btn" aria-label="切换昼夜"><svg class="i sun"><use href="#i-sun"/></svg><svg class="i moon"><use href="#i-moon"/></svg></button>
 <button class="pc-theme" id="reset-btn" aria-label="重置预览数据"><svg class="i"><use href="#i-refresh"/></svg></button>
 <button class="pc-theme pc-more" id="preview-more" aria-label="预览选项" aria-haspopup="menu"><svg class="i"><use href="#i-more"/></svg></button>
</div>

<main class="stage" id="stage">
 <section class="view view-chat" id="view-chat" data-view-name="chat">
  <div class="chat-top" id="chat-top">
   <div class="queue" id="ling-inputs" hidden aria-label="灵的工作队列"></div>
   <div class="requests" id="ling-requests" hidden aria-label="灵在等待你处理的事项"></div>
  </div>
  <div class="conversation" id="conversation" aria-label="与灵的交流记录" aria-live="polite"><div class="thread" id="thread"></div></div>
  <div class="composer-wrap" id="composer-wrap">
   <div class="ret-chip" id="jump-latest" hidden><button type="button" data-act="jump-latest"><svg class="i"><use href="#i-down"/></svg>最新</button></div>
   <form class="composer" id="composer" autocomplete="off">
    <div class="targets" id="targets" role="radiogroup" aria-label="消息归属"><span class="target-ink" aria-hidden="true"></span></div>
    <div class="files" id="files" hidden></div>
    <label for="input" class="sr">消息内容</label>
    <textarea id="input" rows="1" placeholder="发送消息，或交代一项工作…"></textarea>
    <div class="composer-bar">
     <div class="bar-left">
      <button type="button" class="c-btn" id="attach-btn" aria-label="添加附件" title="添加文件，单个文件不超过 25 MiB；图片不超过 5 MiB"><svg class="i"><use href="#i-clip"/></svg></button>
      <input type="file" id="file-input" multiple hidden>
      <button type="button" class="c-pill" id="model-btn" aria-haspopup="menu"><i class="model-dot"></i><span id="model-label">deepseek-v4.1-flash</span><svg class="i xs"><use href="#i-down"/></svg></button>
      <button type="button" class="c-pill" id="effort-btn" aria-haspopup="menu" aria-label="思考强度"><span class="bars" id="effort-bars" data-level="3"><i></i><i></i><i></i><i></i><i></i></span><span id="effort-label">思考 · 高</span></button>
     </div>
     <div class="bar-right">
      <button type="button" class="ctx-gauge" id="ctx-gauge" aria-label="上下文已用 24%，打开上下文管理"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><circle class="arc" cx="10" cy="10" r="7.5" pathLength="100" style="--p:24"/></svg><span id="ctx-pct">24%</span></button>
      <button type="button" class="c-pill stop-pill" id="stop-reply" data-act="stop" hidden><svg class="i xs"><use href="#i-stop"/></svg>停止</button>
      <button type="submit" class="send" id="send" aria-label="发送"><svg class="i go"><use href="#i-up"/></svg><svg class="i halt"><use href="#i-stop"/></svg><i class="send-ring"></i></button>
     </div>
    </div>
   </form>
   <p class="composer-hint">
    <span id="stat-turn">3 轮</span>
    <button type="button" class="stat-btn" id="stat-tokens" aria-expanded="false">24,360 tok</button>
    <button type="button" class="stat-btn" id="stat-context" aria-expanded="false">上下文 24%</button>
    <span class="hint-kbd">Enter 发送 · Shift + Enter 换行</span>
   </p>
  </div>
 </section>
 <section class="view view-page" id="view-work" data-view-name="work" hidden></section>
 <section class="view view-page" id="view-context" data-view-name="context" hidden></section>
 <section class="view view-page" id="view-skills" data-view-name="skills" hidden></section>
 <section class="view view-page" id="view-plugins" data-view-name="plugins" hidden></section>
 <section class="view view-page" id="view-settings" data-view-name="settings" hidden></section>
</main>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="usage-pop" id="usage-panel" hidden></div>
<div class="toast" id="toast" role="status"></div>
<p class="sr" id="live" aria-live="polite"></p>

<dialog class="sheet" id="editor" aria-labelledby="editor-title">
 <form method="dialog" id="editor-form">
  <h2 id="editor-title">编辑</h2>
  <p class="sheet-note" id="editor-desc">只改变当前预览，不写入 Nexus。</p>
  <label class="sr" for="editor-text">内容</label>
  <textarea id="editor-text" required></textarea>
  <p class="sheet-error" id="editor-error" role="alert"></p>
  <footer><button class="btn ghost" value="cancel" formnovalidate>取消</button><button class="btn solid" value="save" id="editor-save">保存</button></footer>
 </form>
</dialog>

<dialog class="sheet tall" id="provider-dialog" aria-labelledby="provider-title">
 <div class="sheet-body">
  <header class="sheet-head"><div><h2 id="provider-title">添加提供商</h2><p class="sheet-note">接口协议决定请求体格式；模型可分别设置上下文窗口。</p></div><button class="ic-btn" type="button" data-close="provider-dialog" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button></header>
  <div class="fields">
   <label class="field">名称<input id="p-name" type="text" placeholder="DeepSeek" autocomplete="off"></label>
   <label class="field">接口协议<select id="p-family">
    <option value="anthropic_messages">Anthropic Messages（/v1/messages）</option>
    <option value="openai_chat_completions">OpenAI Chat Completions（/v1/chat/completions）</option>
    <option value="openai_responses">OpenAI Responses（/v1/responses）</option>
   </select></label>
   <label class="field span-2">Base URL<input id="p-base" type="url" placeholder="https://api.example.com" autocomplete="off"></label>
  </div>
  <div class="model-editor">
   <div class="sec-h"><h3>模型</h3><span>上下文窗口只用于本地上下文裁剪与压缩预算，留空使用默认值。</span></div>
   <div id="p-models-list" class="model-rows"></div>
   <div class="model-add"><input id="p-model-new" type="text" placeholder="新增模型名，例如 deepseek-v4.1-flash" autocomplete="off" aria-label="新增模型名"><button id="p-model-add" class="btn ghost sm" type="button"><svg class="i xs"><use href="#i-plus"/></svg>添加</button></div>
   <p id="p-models-error" class="sheet-error" aria-live="polite"></p>
  </div>
  <label class="field">API Key<input id="p-key" type="password" autocomplete="off" placeholder="sk-..."></label>
  <p id="provider-error" class="sheet-error" role="alert"></p>
  <footer class="sheet-foot"><button id="p-delete" class="btn ghost danger" type="button" hidden><svg class="i xs"><use href="#i-trash"/></svg>删除</button><span class="spacer"></span><button class="btn ghost" type="button" data-close="provider-dialog">取消</button><button id="p-save" class="btn solid" type="button">保存</button></footer>
 </div>
</dialog>

<dialog class="sheet tall" id="mcp-dialog" aria-labelledby="mcp-dialog-title">
 <div class="sheet-body">
  <header class="sheet-head"><div><h2 id="mcp-dialog-title">添加 MCP 服务</h2><p class="sheet-note">连接本地 stdio 进程或 HTTP 服务，供灵调用其中的工具。</p></div><button class="ic-btn" type="button" data-close="mcp-dialog" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button></header>
  <div class="fields">
   <label class="field">名称<input id="mcp-name" type="text" autocomplete="off" placeholder="例如：filesystem"></label>
   <label class="field">类型<select id="mcp-transport"><option value="stdio">本地进程（stdio）</option><option value="http">HTTP</option></select></label>
  </div>
  <div id="mcp-stdio-fields" class="fields">
   <label class="field span-2">命令<input id="mcp-command" type="text" autocomplete="off" placeholder="例如：npx"></label>
   <label class="field span-2">参数（每行一个，或 JSON 数组）<textarea id="mcp-args" rows="3" placeholder="-y&#10;@modelcontextprotocol/server-filesystem&#10;C:\work"></textarea></label>
   <label class="field span-2">环境变量（JSON 对象）<textarea id="mcp-env" rows="3" placeholder='{"KEY":"value"}'></textarea></label>
  </div>
  <div id="mcp-http-fields" class="fields" hidden>
   <label class="field span-2">URL<input id="mcp-url" type="url" autocomplete="off" placeholder="https://example.com/mcp"></label>
   <label class="field span-2">Bearer token<input id="mcp-token" type="password" autocomplete="off" placeholder="可选"></label>
   <label class="check" id="mcp-clear-token-wrap" hidden><input id="mcp-clear-token" type="checkbox"> 清除已保存的 token</label>
  </div>
  <label class="check"><input id="mcp-enabled" type="checkbox" checked> 启用这个服务</label>
  <p id="mcp-error" class="sheet-error" role="alert"></p>
  <footer class="sheet-foot"><button id="mcp-delete" class="btn ghost danger" type="button" hidden><svg class="i xs"><use href="#i-trash"/></svg>删除</button><span class="spacer"></span><button class="btn ghost" type="button" data-close="mcp-dialog">取消</button><button id="mcp-save" class="btn solid" type="button">保存</button></footer>
 </div>
</dialog>

<dialog class="sheet" id="skill-dialog" aria-labelledby="skill-dialog-title">
 <form class="sheet-body" id="skill-form">
  <header class="sheet-head"><div><h2 id="skill-dialog-title">新建技能</h2><p class="sheet-note">名称需为英文 slug；项目技能会覆盖同名的个人技能。</p></div><button class="ic-btn" type="button" data-close="skill-dialog" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button></header>
  <div class="fields">
   <label class="field">名称（英文 slug）<input id="skill-name" type="text" maxlength="64" autocomplete="off" placeholder="writing-style"></label>
   <label class="field">来源<select id="skill-source"><option value="personal">个人</option><option value="project">项目</option><option value="builtin" hidden>内置</option></select></label>
   <label class="field span-2">摘要<textarea id="skill-description" rows="3" maxlength="1000" placeholder="说明何时使用这个技能"></textarea></label>
   <label class="field span-2">详细正文（可留空）<textarea id="skill-body" rows="9"></textarea></label>
  </div>
  <p id="skill-error" class="sheet-error" role="alert" hidden></p>
  <footer class="sheet-foot"><span class="spacer"></span><button id="skill-cancel" class="btn ghost" type="button">取消</button><button id="skill-save" class="btn solid" type="submit">保存技能</button></footer>
 </form>
</dialog>

<dialog class="sheet preview-sheet" id="file-preview" aria-labelledby="fp-title">
 <header class="fp-head"><div><strong id="fp-title">文件预览</strong><span id="fp-meta"></span></div><button class="ic-btn" type="button" data-close="file-preview" aria-label="关闭预览"><svg class="i"><use href="#i-close"/></svg></button></header>
 <div class="fp-body" id="fp-body"></div>
</dialog>
