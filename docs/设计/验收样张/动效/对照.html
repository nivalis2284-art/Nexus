<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus 动效前后对照</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1018;color:#edf2fc;font:15px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 10px}h2{font-size:21px;margin:32px 0 14px}p{color:#afbbd1;margin:0 0 18px}a{color:#b8ceff}button{border:1px solid #52617b;border-radius:10px;padding:8px 16px;color:#edf2fc;background:#1b243a;cursor:pointer}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:#131a2c;border:1px solid #293246;border-radius:12px;overflow:hidden}figcaption{padding:10px 14px;font-size:13px;color:#c0cbe0}video{width:100%;display:block}.facts{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.facts span{background:#1b243a;padding:6px 12px;border-radius:8px;color:#c7d6ef}.strip{display:grid;grid-template-columns:88px repeat(5,1fr);gap:12px;margin-bottom:20px}.strip img{display:block;width:100%}.label{padding-top:10px;font-size:16px}.label small{display:block;color:#afbbd1;font-size:12px}footer{padding:24px 0;color:#9cabc5;font-size:13px}@media(max-width:760px){main{padding:16px}.pair{grid-template-columns:1fr}.strip{min-width:900px}.samples{overflow:auto}}</style><main><h1>Nexus · 动效前后对照</h1><p>2026-11-03 · 独立预览 · 标准速度。三个场景采用相同的操作顺序；录制初始化耗时可能略有差异。</p><div class="facts"><span>主要动作560ms</span><span>局部420ms</span><span>分组70ms</span><span>组内40ms</span><span>退场220ms</span><span>流式文字200ms</span></div><p><a href="../../页面模板.html?tools=1">打开可交互预览</a>　·　<a href="等时采样.html">打开灵岛等时采样</a>　·　<a href="../../验收记录.md">验收记录</a></p><section id="case-0"><h2>页面切换</h2><p><button onclick="replay(this)">两侧从头播放</button></p><div class="pair"><figure><figcaption>改动前 · 页面切换</figcaption><video controls playsinline preload="metadata" src="before-页面切换.mp4"></video></figure><figure><figcaption>改动后 · 页面切换</figcaption><video controls playsinline preload="metadata" src="after-页面切换.mp4"></video></figure></div></section><section id="case-1"><h2>灵岛切换</h2><p><button onclick="replay(this)">两侧从头播放</button></p><div class="pair"><figure><figcaption>改动前 · 灵岛切换</figcaption><video controls playsinline preload="metadata" src="before-灵岛切换.mp4"></video></figure><figure><figcaption>改动后 · 灵岛切换</figcaption><video controls playsinline preload="metadata" src="after-灵岛切换.mp4"></video></figure></div></section><section id="case-2"><h2>发送与回复</h2><p><button onclick="replay(this)">两侧从头播放</button></p><div class="pair"><figure><figcaption>改动前 · 发送与回复</figcaption><video controls playsinline preload="metadata" src="before-发送与回复.mp4"></video></figure><figure><figcaption>改动后 · 发送与回复</figcaption><video controls playsinline preload="metadata" src="after-发送与回复.mp4"></video></figure></div></section><h2>灵岛等时采样</h2><div class="samples"><div class="strip"><div class="label">改动前<small>外壳240ms</small></div><figure><img src="before-灵岛-0ms.png"><figcaption>0ms</figcaption></figure><figure><img src="before-灵岛-140ms.png"><figcaption>140ms</figcaption></figure><figure><img src="before-灵岛-280ms.png"><figcaption>280ms</figcaption></figure><figure><img src="before-灵岛-560ms.png"><figcaption>560ms</figcaption></figure><figure><img src="before-灵岛-840ms.png"><figcaption>840ms</figcaption></figure></div><div class="strip"><div class="label">改动后<small>外壳560ms</small></div><figure><img src="after-灵岛-0ms.png"><figcaption>0ms</figcaption></figure><figure><img src="after-灵岛-140ms.png"><figcaption>140ms</figcaption></figure><figure><img src="after-灵岛-280ms.png"><figcaption>280ms</figcaption></figure><figure><img src="after-灵岛-560ms.png"><figcaption>560ms</figcaption></figure><figure><img src="after-灵岛-840ms.png"><figcaption>840ms</figcaption></figure></div></div><footer>持续循环和正式前端保持原状。本轮未处理手机空态溢出、中枢锚点错位与配色问题；实体手机帧率未验证。</footer></main><script>function replay(button){button.closest("section").querySelectorAll("video").forEach(v=>{v.currentTime=0;v.play()})}</script></html>
