<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网页浏览</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243c38;background:#f5f7f4;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:36px 22px 72px}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-.04em}h2{font-size:18px}p{line-height:1.65}.intro{color:#6a7e76;margin-top:8px}.header,.section-head{display:flex;justify-content:space-between;align-items:start;gap:16px}.header{margin-bottom:26px}.badge{background:#e0ede3;color:#426d50;border-radius:99px;padding:6px 12px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:18px;align-items:start}.stack{display:grid;gap:18px}.card{background:#fff;border:1px solid #e1e9e2;border-radius:16px;padding:22px;box-shadow:0 4px 18px #193c2110}.section-head{align-items:center;margin-bottom:14px}.help,.muted{color:#74857d;font-size:13px}.help{margin-top:6px}.row,.actions{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1;min-width:0}.actions{flex-wrap:wrap;margin-top:12px}.field{display:grid;gap:6px;margin-top:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:600;color:#526b5e}input,textarea,select{width:100%;font:inherit;border:1px solid #d5e0d6;border-radius:9px;background:#fff;color:#243c38;padding:10px 11px;outline:none}input:focus,textarea:focus,select:focus{border-color:#75a785;box-shadow:0 0 0 3px #82b58d24}button{font:inherit;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:#eaf2eb;color:#376347;font-weight:600}button:hover{filter:brightness(.97)}button:disabled{opacity:.5;cursor:wait}.primary{background:#3e7855;color:#fff}.quiet{background:transparent;color:#688075;padding:6px 8px}.toggle{display:flex;align-items:center;gap:9px;margin-top:14px}.toggle input{width:auto;accent-color:#3e7855}.notice{display:none;margin-bottom:18px;border-radius:10px;padding:11px 14px;background:#edf5ed;color:#386648;white-space:pre-wrap;overflow-wrap:anywhere}.notice.show{display:block}.notice.error{background:#fff0ed;color:#a5463e}.list{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #e7eee8;border-radius:11px;padding:13px;overflow-wrap:anywhere}.item-title{font-weight:650;color:#315e47}.item p{font-size:13px;margin-top:5px;color:#5f756a}.meta{font-size:12px;color:#85958b;margin-top:6px;overflow-wrap:anywhere}.empty{color:#899a90;font-size:13px;padding:8px 0}.result-link{color:#315e47;font-weight:650;text-decoration:none}.result-link:hover{text-decoration:underline}.page-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:380px;overflow:auto;background:#f7faf7;border-radius:10px;padding:13px;font-size:13px;margin-top:12px}.element-list{max-height:300px;overflow:auto}.element{display:flex;align-items:center;gap:10px}.element button{margin-left:auto;flex:none}.status{padding:12px;background:#f4f8f4;border-radius:10px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.path{overflow-wrap:anywhere;margin-top:10px;font-size:13px;color:#526b5e}a{overflow-wrap:anywhere}@media(max-width:760px){main{padding:24px 15px 50px}.grid{grid-template-columns:1fr}.header{align-items:center}h1{font-size:25px}}@media(max-width:420px){.fields{grid-template-columns:1fr}.row{flex-wrap:wrap}.row>*:first-child{flex-basis:100%}}
</style>
</head>
<body><main>
<header class="header"><div><h1>网页浏览</h1><p class="intro">搜索网页，阅读内容，并在专用浏览器中操作页面。</p></div><span id="browser-status" class="badge">正在获取状态</span></header>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="grid"><div class="stack">
<section class="card"><div class="section-head"><div><h2>搜索网页</h2><p class="help">默认使用 Bing，可在设置中更换搜索服务。</p></div></div><form id="search-form" class="row"><input id="query" aria-label="搜索内容" placeholder="输入搜索内容" required><button class="primary">搜索</button></form><div id="results" class="list"><p class="empty">搜索结果会显示在这里。</p></div></section>
<section class="card"><div class="section-head"><div><h2>浏览器</h2><p class="help">输入网址或从搜索结果打开页面。</p></div><button id="stop-browser" class="quiet" type="button">关闭浏览器</button></div><form id="navigate-form" class="row"><input id="url" aria-label="网页地址" placeholder="https://example.com" required><button class="primary">打开</button></form><div class="field"><label for="tabs">当前标签页</label><select id="tabs"><option value="">暂无标签页</option></select></div><div class="actions"><button id="refresh-tabs" type="button">刷新标签页</button><button id="read" type="button">读取页面</button><button id="back" type="button">后退</button><button id="forward" type="button">前进</button><button id="reload" type="button">重新加载</button><button id="close-tab" type="button">关闭标签页</button></div><p id="page-title" class="meta"></p><div id="page-text" class="page-text">读取页面后，正文会显示在这里。</div><div class="section-head" style="margin-top:18px;margin-bottom:0"><div><h2>页面元素</h2><p class="help">选择元素后，可使用下方操作。</p></div></div><div id="elements" class="list element-list"><p class="empty">读取页面后显示可操作元素。</p></div><div class="fields"><div class="field"><label for="ref">元素引用</label><input id="ref" placeholder="选择或输入引用"></div><div class="field"><label for="action-text">输入内容 / 选项值</label><input id="action-text" placeholder="填写或选择的值"></div></div><div class="actions"><button id="click" type="button">点击</button><button id="fill" type="button">填写</button><button id="select" type="button">选择</button><button id="press" type="button">按 Enter</button><button id="scroll" type="button">向下滚动</button></div><div class="actions"><button id="screenshot" type="button">保存 PNG 截图</button></div><p id="screenshot-path" class="path"></p></section>
</div><div class="stack">
<section class="card"><div class="section-head"><div><h2>设置</h2><p class="help">配置搜索服务与专用浏览器。</p></div></div><form id="settings-form"><div class="field"><label for="search-provider">搜索服务</label><select id="search-provider"><option value="bing">Bing（无需密钥）</option><option value="brave">Brave</option><option value="searxng">SearxNG</option></select></div><div class="field"><label for="search-url">搜索服务地址（可选）</label><input id="search-url" placeholder="SearxNG 服务地址"></div><div class="field"><label for="search-key-env">密钥环境变量名（可选）</label><input id="search-key-env" autocomplete="off" placeholder="例如 BRAVE_SEARCH_API_KEY"></div><div class="field"><label for="search-key">搜索密钥（可选）</label><input id="search-key" type="password" autocomplete="new-password" placeholder="留空保留已保存的密钥"></div><p id="key-status" class="help"></p><div class="field"><label for="browser-path">浏览器路径（可选）</label><input id="browser-path" placeholder="留空自动查找"></div><div class="field"><label for="browser-proxy">浏览器代理（可选）</label><input id="browser-proxy" placeholder="例如 http://127.0.0.1:7890"></div><label class="toggle"><input type="checkbox" id="headless"> 无头模式</label><div class="actions"><button class="primary">保存设置</button><button id="clear-key" type="button">清除已保存密钥</button></div></form><p class="help">使用独立的浏览器配置文件，Cookie 会保留；插件卸载时关闭其浏览器。不会连接已有的 Chrome 用户浏览器。网页内容仅供参考，网站操作使用主机的正常权限。</p></section>
<section class="card"><div class="section-head"><div><h2>最近活动</h2><p class="help">查看搜索与浏览操作记录。</p></div><button id="refresh-status" class="quiet" type="button">刷新</button></div><div id="history" class="list"><p class="empty">暂无活动。</p></div></section>
</div></div></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const node = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = String(text); return el; };
let settingsDirty = false, initialized = false;
async function call(action, values = {}) {
  const response = await fetch('/api/plugins/web-browser/call', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,values})});
  let data; try { data = await response.json(); } catch (_) { throw new Error('服务返回了无法读取的响应'); }
  if (!response.ok || data.error) throw new Error(typeof data.error === 'string' ? data.error : `请求失败（${response.status}）`);
  return data;
}
function notice(text, error = false) { $('notice').textContent = text; $('notice').className = 'notice show' + (error ? ' error' : ''); }
function fail(error) { notice(error.message || String(error), true); }
function safeUrl(value) { try { const u = new URL(value); return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : ''; } catch (_) { return ''; } }
function renderHistory(history) { const box = $('history'); box.replaceChildren(); if (!history.length) { box.append(node('p','empty','暂无活动。')); return; } for (const entry of history) { const item = node('div','item'); item.append(node('div','item-title',entry.summary || entry.action || '操作'),node('div','meta',[entry.at,entry.action,entry.status].filter(Boolean).join(' · '))); box.append(item); } }
function renderSnapshot(data, force = false) {
  const s = data.settings || {};
  if (force || !initialized || !settingsDirty) { $('search-provider').value = s.search_provider || 'bing'; $('search-url').value = s.search_url || ''; $('search-key-env').value = s.search_key_env || ''; $('browser-path').value = s.browser_path || ''; $('browser-proxy').value = s.browser_proxy || ''; $('headless').checked = !!s.headless; initialized = true; }
  $('browser-status').textContent = data.browser && data.browser.running ? '浏览器运行中' : '浏览器未运行';
  $('key-status').textContent = data.key_present ? '已检测到搜索密钥' : '未检测到搜索密钥';
  renderHistory(data.history || []);
}
async function refreshStatus(force = false) { renderSnapshot(await call('snapshot'), force); }
async function refreshTabs(preferred) { const data = await call('tabs'); const tabs = data.tabs || []; const select = $('tabs'); const current = preferred || select.value; select.replaceChildren(); if (!tabs.length) { select.append(node('option','', '暂无标签页')); select.firstChild.value = ''; return; } for (const tab of tabs) { const option = node('option','',tab.title || tab.url || tab.id); option.value = tab.id; select.append(option); } if (tabs.some(t => String(t.id) === String(current))) select.value = current; }
function renderPage(data) { $('ref').value = ''; const page = data.page || data; $('page-title').textContent = [page.title,page.url].filter(Boolean).join(' · '); $('page-text').textContent = page.text || page.content || page.body || '页面没有可显示的正文。'; if (page.url) $('url').value = page.url; const elements = page.elements || []; const box = $('elements'); box.replaceChildren(); if (!elements.length) { box.append(node('p','empty','未发现可操作元素。')); return; } for (const element of elements) { const item = node('div','item element'); const info = node('div'); info.append(node('div','item-title',[element.ref,element.tag,element.name || element.text || element.label].filter(Boolean).join(' · '))); if (element.value) info.append(node('div','meta',element.value)); const choose = node('button','', '选择'); choose.type = 'button'; choose.onclick = () => { $('ref').value = element.ref || ''; $('ref').focus(); }; item.append(info,choose); box.append(item); } }
async function showPage(data) { renderPage(data); await refreshTabs((data.page || data).tab_id || (data.page || data).id); await refreshStatus(); }
$('search-form').onsubmit = async e => { e.preventDefault(); try { const data = await call('search',{query:$('query').value.trim(),limit:10}); const box = $('results'); box.replaceChildren(); if (!(data.results || []).length) box.append(node('p','empty','没有找到搜索结果。')); for (const result of data.results || []) { const item = node('article','item'); const link = node('a','result-link',result.title || result.url || '未命名结果'); const url = safeUrl(result.url); if (url) { link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer'; } item.append(link,node('div','meta',result.url || ''),node('p','',result.snippet || '')); if (url) { const actions = node('div','actions'); const open = node('button','', '在浏览器中打开'); open.type = 'button'; open.onclick = async () => { try { await showPage(await call('navigate',{url,tab_id:''})); notice('页面已打开。'); } catch (error) { fail(error); } }; actions.append(open); item.append(actions); } box.append(item); } await refreshStatus(); } catch (error) { fail(error); } };
$('navigate-form').onsubmit = async e => { e.preventDefault(); try { await showPage(await call('navigate',{url:$('url').value.trim(),tab_id:$('tabs').value})); notice('页面已打开。'); } catch (error) { fail(error); } };
$('refresh-tabs').onclick = async () => { try { await refreshTabs(); notice('标签页已刷新。'); } catch (e) { fail(e); } };
$('read').onclick = async () => { try { await showPage(await call('read',{tab_id:$('tabs').value,max_chars:16000})); notice('页面已读取。'); } catch (e) { fail(e); } };
async function interact(action, extra = {}) { try { await showPage(await call('interact',{action,tab_id:$('tabs').value,...extra})); notice('操作已完成。'); } catch (e) { fail(e); } }
$('click').onclick = () => interact('click',{ref:$('ref').value.trim()}); $('fill').onclick = () => interact('fill',{ref:$('ref').value.trim(),text:$('action-text').value}); $('select').onclick = () => interact('select',{ref:$('ref').value.trim(),value:$('action-text').value}); $('press').onclick = () => interact('press',{ref:$('ref').value.trim(),key:'Enter'}); $('scroll').onclick = () => interact('scroll',{delta_y:600}); $('back').onclick = () => interact('back'); $('forward').onclick = () => interact('forward'); $('reload').onclick = () => interact('reload'); $('close-tab').onclick = () => interact('close');
$('screenshot').onclick = async () => { try { const data = await call('screenshot',{tab_id:$('tabs').value,full_page:false}); $('screenshot-path').textContent = data.path ? '截图已保存：' + data.path : '截图已保存。'; await refreshStatus(); notice('截图已保存。'); } catch (e) { fail(e); } };
$('stop-browser').onclick = async () => { try { await call('stop_browser'); await refreshTabs(); await refreshStatus(); $('page-title').textContent = ''; $('page-text').textContent = '浏览器已关闭。'; $('elements').replaceChildren(node('p','empty','读取页面后显示可操作元素。')); notice('浏览器已关闭。'); } catch (e) { fail(e); } };
$('settings-form').addEventListener('input',() => { settingsDirty = true; }); $('settings-form').addEventListener('change',() => { settingsDirty = true; });
$('settings-form').onsubmit = async e => { e.preventDefault(); try { const values = {search_provider:$('search-provider').value,search_url:$('search-url').value.trim(),search_key_env:$('search-key-env').value.trim(),browser_path:$('browser-path').value.trim(),headless:$('headless').checked,browser_proxy:$('browser-proxy').value.trim()}; if ($('search-key').value) values.search_key = $('search-key').value; await call('configure',values); $('search-key').value = ''; settingsDirty = false; await refreshStatus(true); notice('设置已保存。'); } catch (error) { fail(error); } };
$('clear-key').onclick = async () => { try { await call('clear_key'); $('search-key').value = ''; await refreshStatus(); notice('已清除保存的密钥。'); } catch (e) { fail(e); } };
$('refresh-status').onclick = async () => { try { await refreshStatus(); notice('状态已刷新。'); } catch (e) { fail(e); } };
refreshStatus().catch(fail); setInterval(() => { refreshStatus().catch(() => {}); },15000);
</script></body></html>
