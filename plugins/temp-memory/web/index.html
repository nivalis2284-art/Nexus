<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>长期记忆</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243c38;background:#f5f7f4;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:36px 22px 72px}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-.04em}h2{font-size:18px}h3{font-size:15px}p{line-height:1.65}.intro{color:#6a7e76;margin-top:8px}.header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:26px}.badge{background:#e0ede3;color:#426d50;border-radius:99px;padding:6px 12px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:18px;align-items:start}.stack{display:grid;gap:18px}.card{background:white;border:1px solid #e1e9e2;border-radius:16px;padding:22px;box-shadow:0 4px 18px #193c2110}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.muted,.help{color:#74857d;font-size:13px}.help{margin-top:6px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#f4f8f4;border-radius:10px;padding:12px 10px}.stat strong{display:block;font-size:20px;color:#315e47}.stat span{font-size:12px;color:#75877c}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}.field{display:grid;gap:6px;margin-top:14px}label{font-size:13px;font-weight:600;color:#526b5e}input,textarea,select{width:100%;font:inherit;border:1px solid #d5e0d6;border-radius:9px;background:#fff;color:#243c38;padding:10px 11px;outline:none}input:focus,textarea:focus{border-color:#75a785;box-shadow:0 0 0 3px #82b58d24}textarea{resize:vertical;min-height:98px}button{font:inherit;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:#eaf2eb;color:#376347;font-weight:600}button:hover{filter:brightness(.97)}button:disabled{opacity:.5;cursor:wait}.primary{background:#3e7855;color:white}.quiet{background:transparent;color:#688075;padding:6px 8px}.danger{color:#ad5d55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notes,.results{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #e7eee8;border-radius:11px;padding:13px}.item-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.item-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.meta{font-size:12px;color:#85958b;margin-top:8px;overflow-wrap:anywhere}.empty{color:#899a90;font-size:13px;padding:10px 0}.message{display:none;margin-bottom:18px;border-radius:10px;padding:11px 14px;background:#edf5ed;color:#386648;white-space:pre-wrap;overflow-wrap:anywhere}.message.error{background:#fff0ed;color:#a5463e}.message.show{display:block}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;align-items:center;gap:9px;margin-top:14px}.toggle input{width:auto;accent-color:#3e7855}.status{padding:12px;background:#f4f8f4;border-radius:10px;margin-top:15px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.export-path{display:none;margin-top:10px}.export-path.show{display:block}.footer-note{margin-top:12px}.hidden{display:none!important}@media(max-width:760px){main{padding:24px 15px 50px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.header{align-items:center}h1{font-size:25px}}@media(max-width:400px){.inline-fields{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main>
<header class="header"><div><h1>长期记忆</h1><p class="intro">整理值得记住的信息，让以后每一次对话更有连续性。</p></div><span class="badge">本地记忆</span></header>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="grid"><div class="stack">
<section class="card"><div class="section-head"><h2>记忆概览</h2><button id="refresh" class="quiet">刷新</button></div><div class="stats" id="stats"></div><p class="help">原始记录与整理后的笔记共同组成记忆。无需配置模型，也可以使用中文关键词检索。</p><p id="archive-error" class="help"></p></section>
<section class="card"><div class="section-head"><div><h2>搜索记忆</h2><p class="help">查找笔记和原始记录片段</p></div></div><form id="search-form" class="row"><input id="query" placeholder="输入想查找的内容" aria-label="搜索内容" required><button class="primary">搜索</button></form><div id="results" class="results"><p class="empty">输入关键词，找到相关记忆。</p></div></section>
<section class="card"><div class="section-head"><div><h2>记忆笔记</h2><p class="help">保存想长期保留的信息</p></div><button id="new-note">新建笔记</button></div>
<form id="note-form" class="hidden"><div class="field"><label for="content">内容</label><textarea id="content" required placeholder="写下需要记住的内容"></textarea></div><div class="inline-fields"><div class="field"><label for="note-key">标识（可选）</label><input id="note-key" placeholder="用于识别这条笔记"></div><div class="field"><label for="tags">标签（可选）</label><input id="tags" placeholder="用逗号分隔"></div></div><div class="field"><label for="source-id">来源 ID（可选）</label><input id="source-id"></div><div class="actions"><button class="primary">保存笔记</button><button type="button" id="cancel-note">取消</button></div></form>
<div id="notes" class="notes"></div></section>
</div><div class="stack">
<section class="card"><div class="section-head"><div><h2>召回设置</h2><p class="help">设置会保留，供后续对话使用</p></div></div><form id="settings-form"><label class="toggle"><input type="checkbox" id="auto-recall"> 自动召回相关记忆</label><div class="inline-fields"><div class="field"><label for="top-k">召回数量</label><input id="top-k" type="number" min="1" max="12" required></div><div class="field"><label for="context-chars">上下文字符数</label><input id="context-chars" type="number" min="500" max="16000" required></div></div><div class="actions"><button class="primary">保存设置</button></div></form></section>
<section class="card"><div class="section-head"><div><h2>语义检索</h2><p class="help">可选：配置 OpenAI 兼容的 embedding 服务，结合关键词与向量检索。配置后，待索引的记忆文本与检索问题会发送至该服务。</p></div></div><form id="embedding-form"><div class="field"><label for="embedding-url">服务地址</label><input id="embedding-url" type="url" placeholder="https://…"></div><div class="field"><label for="embedding-model">模型名称</label><input id="embedding-model" placeholder="例如 text-embedding-3-small"></div><div class="field"><label for="embedding-key-env">密钥环境变量名（可选）</label><input id="embedding-key-env" autocomplete="off" placeholder="例如 NEXUS_MEMORY_EMBEDDING_KEY"></div><div class="field"><label for="embedding-key">密钥（可选）</label><input id="embedding-key" type="password" autocomplete="new-password" placeholder="留空保留已保存的密钥"></div><div class="actions"><button class="primary">保存配置</button><button type="button" id="clear-key">清除已保存密钥</button></div></form><div id="embedding-status" class="status"></div><div class="actions"><button id="reindex">重建向量索引</button></div></section>
<section class="card"><div class="section-head"><div><h2>备份记忆</h2><p class="help">导出完整的原始记录和记忆数据。</p></div></div><button id="export">生成备份</button><div id="export-path-wrap" class="export-path"><label for="export-path">备份已保存在本机路径</label><input id="export-path" readonly><div class="actions"><button id="copy-path">复制路径</button></div><p class="help">在运行 Nexus 的电脑上打开此文件。</p></div></section>
</div></div></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let settings = {}, editing = null;
async function call(action, values = {}) {
  const response = await fetch('/api/plugins/temp-memory/call', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action, values})});
  let data; try { data = await response.json(); } catch (_) { throw new Error('服务返回了无法读取的响应'); }
  if (!response.ok || data.error) throw new Error(data.error || `请求失败（${response.status}）`);
  return data;
}
function message(text, error = false) { const el = $('message'); el.textContent = text; el.className = 'message show' + (error ? ' error' : ''); }
function fail(error) { message(error.message || String(error), true); }
function node(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; if (text != null) el.textContent = text; return el; }
function renderSnapshot(data) {
  settings = data.settings || {}; const stats = data.stats || {}; $('stats').replaceChildren();
  for (const [key, label] of [['notes','笔记'],['chunks','片段'],['sources','来源'],['observations','观察'],['vectors','向量']]) { const item = node('div','stat'); item.append(node('strong','',String(stats[key] ?? 0)), node('span','',label)); $('stats').append(item); }
  $('auto-recall').checked = !!settings.auto_recall; $('top-k').value = settings.top_k ?? 6; $('context-chars').value = settings.context_chars ?? 6000;
  $('embedding-url').value = settings.embedding_url || ''; $('embedding-model').value = settings.embedding_model || ''; $('embedding-key-env').value = settings.embedding_key_env || '';
  const e = data.embedding || {}; $('embedding-status').textContent = [e.configured ? '服务已配置' : '尚未配置语义检索', e.key_present ? '密钥已设置' : '未检测到密钥', e.status || '', e.model_id ? '模型：' + e.model_id : '', e.pending ? '待索引：' + e.pending : '', e.error ? '错误：' + e.error : ''].filter(Boolean).join(' · ');
  $('archive-error').textContent = data.archive_error ? '原文归档/索引处理异常：' + data.archive_error : '';
  $('export').disabled = data.export_ready === false;
}
async function refresh() { const [snapshot, list] = await Promise.all([call('snapshot'), call('list',{limit:100,offset:0})]); renderSnapshot(snapshot); renderNotes(list.notes || []); }
function renderNotes(notes) {
  const box = $('notes'); box.replaceChildren(); if (!notes.length) { box.append(node('p','empty','还没有记忆笔记。')); return; }
  for (const note of notes) {
    const item = node('article','item'), head = node('div','item-head'), content = node('p','item-text',note.content || ''); head.append(content);
    const controls = node('div','row'); const edit = node('button','quiet','编辑'); edit.type = 'button'; edit.onclick = () => editNote(note); const del = node('button','quiet danger','移除'); del.type = 'button'; del.onclick = async () => { if (!confirm('移除这条笔记？原始记录仍会保留。')) return; try { await call('forget',{id:note.id}); await refresh(); message('笔记已移除，原始记录仍会保留。'); } catch(e) { fail(e); } }; controls.append(edit,del); head.append(controls); item.append(head);
    item.append(node('div','meta',[note.key && '标识：' + note.key, Array.isArray(note.tags) && note.tags.length && '标签：' + note.tags.join('、'), note.source_id && '来源 ID：' + note.source_id, note.updated_at && '更新：' + note.updated_at].filter(Boolean).join(' · '))); box.append(item);
  }
}
function editNote(note) { editing = note || null; $('note-form').classList.remove('hidden'); $('content').value = note?.content || ''; $('note-key').value = note?.key || ''; $('tags').value = Array.isArray(note?.tags) ? note.tags.join(', ') : ''; $('source-id').value = note?.source_id || ''; $('content').focus(); }
$('new-note').onclick = () => editNote(null); $('cancel-note').onclick = () => { $('note-form').classList.add('hidden'); editing = null; };
$('note-form').onsubmit = async event => { event.preventDefault(); try { await call('upsert',{id:editing?.id || '', content:$('content').value, key:$('note-key').value.trim(), source_id:$('source-id').value.trim(), tags:$('tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)}); $('note-form').classList.add('hidden'); editing = null; await refresh(); message('笔记已保存。'); } catch(e) { fail(e); } };
$('search-form').onsubmit = async event => { event.preventDefault(); try { const data = await call('search',{query:$('query').value,limit:10}); const box = $('results'); box.replaceChildren(); if (!(data.results || []).length) box.append(node('p','empty','没有找到相关记忆。')); for (const result of data.results || []) { const item = node('article','item'); item.append(node('p','item-text',result.text || ''),node('div','meta',[result.kind, result.role, result.source_id && '来源 ID：' + result.source_id, typeof result.score === 'number' && '相关度：' + result.score.toFixed(3)].filter(Boolean).join(' · '))); box.append(item); } } catch(e) { fail(e); } };
function configValues() { return {auto_recall:$('auto-recall').checked,top_k:Number($('top-k').value),context_chars:Number($('context-chars').value),embedding_url:$('embedding-url').value.trim(),embedding_model:$('embedding-model').value.trim(),embedding_key_env:$('embedding-key-env').value.trim()}; }
async function saveSettings(event) { event.preventDefault(); try { const values = configValues(); if ($('embedding-key').value) values.embedding_key = $('embedding-key').value; const data = await call('configure',values); $('embedding-key').value = ''; renderSnapshot(data); message('设置已保存。'); } catch(e) { fail(e); } }
$('settings-form').onsubmit = saveSettings; $('embedding-form').onsubmit = saveSettings;
$('clear-key').onclick = async () => { try { renderSnapshot(await call('clear_key')); $('embedding-key').value = ''; message('已清除保存的密钥。'); } catch(e) { fail(e); } };
$('reindex').onclick = async () => { try { renderSnapshot(await call('reindex')); message('索引任务已启动，可刷新查看进度。'); } catch(e) { fail(e); } };
$('refresh').onclick = async () => { try { await refresh(); message('已刷新。'); } catch(e) { fail(e); } };
$('export').onclick = async () => { try { const data = await call('export'); $('export-path').value = data.path || ''; $('export-path-wrap').classList.add('show'); message('备份已生成。'); } catch(e) { fail(e); } };
$('copy-path').onclick = async () => { try { await navigator.clipboard.writeText($('export-path').value); message('路径已复制。'); } catch (_) { $('export-path').select(); message('请选择并复制备份路径。'); } };
refresh().catch(fail);
</script></body></html>
