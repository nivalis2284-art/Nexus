<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自主活动与长期交代</title>
<style>
  :root {
    --bg:#fff; --panel:#f7f7f8; --line:#e6e6e9; --ink:#1a1a1c;
    --ink-2:#52525b; --muted:#8e8e97; --accent:#5b7cfa;
    --accent-soft:#eef1ff; --danger:#c44338; --ok:#3f7f44;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; }
  [hidden] { display:none !important; }
  .shell { max-width:1040px; margin:0 auto; padding:22px 24px 48px; }
  header { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px; }
  .heading { flex:1 1 380px; min-width:0; }
  h1 { margin:0 0 4px; font-size:21px; letter-spacing:.1px; }
  .sub { color:var(--muted); font-size:12px; }
  .head-actions { display:flex; flex-wrap:wrap; gap:7px; }
  .button { border:1px solid var(--line); border-radius:8px; padding:6px 11px;
    background:#fff; color:var(--ink-2); }
  .button:hover { border-color:#cfcfd5; }
  .button.primary { border-color:#cbd3fa; background:var(--accent-soft); color:#3952b2; }
  .button.danger { color:var(--danger); }
  .status { min-height:21px; margin:12px 0 2px; font-size:12px; color:var(--muted); }
  .status.error { color:var(--danger); }
  .tabs { display:flex; gap:3px; margin:7px 0 16px; border-bottom:1px solid var(--line); }
  .tab { border:0; border-bottom:2px solid transparent; border-radius:0;
    padding:8px 13px; background:transparent; color:var(--muted); }
  .tab.active { border-bottom-color:var(--accent); color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
  .section { margin:0 0 18px; padding:15px 16px; border:1px solid var(--line);
    border-radius:12px; background:var(--panel); }
  .section h2 { margin:0 0 10px; font-size:14px; }
  .section h2 .count { margin-left:5px; color:var(--muted); font-weight:400; }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px 12px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--ink-2); }
  label.wide { grid-column:1 / -1; }
  label.check { flex-direction:row; align-items:center; gap:7px; align-self:end; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; background:#fff; color:var(--ink); }
  input[type=checkbox] { width:auto; }
  textarea { resize:vertical; min-height:62px; }
  .form-foot { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:10px; }
  .hint { flex:1; margin:0; color:var(--muted); font-size:12px; }
  .cards { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .card { padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .card.off { opacity:.67; }
  .card.unread { border-color:#cbd3fa; background:#fafbff; }
  .card-head { display:flex; align-items:flex-start; gap:8px; }
  .card-title { flex:1; min-width:0; margin:0; font-size:13px; font-weight:600;
    overflow-wrap:anywhere; }
  .chip { border-radius:99px; padding:1px 7px; background:#eceef2; color:var(--ink-2);
    font-size:11px; white-space:nowrap; }
  .chip.on { background:#edf7ee; color:var(--ok); }
  .chip.failed { background:#fdf0ef; color:var(--danger); }
  .meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px;
    color:var(--ink-2); font-size:12px; }
  .meta b { color:var(--muted); font-weight:400; }
  .body { margin:7px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
  .body.muted { color:var(--muted); }
  .body.error { color:var(--danger); }
  .card-actions { display:flex; flex-wrap:wrap; gap:5px 11px; margin-top:8px; }
  .link { padding:0; border:0; background:transparent; color:var(--accent); font-size:12px; }
  .link.danger { color:var(--danger); }
  .empty { margin:8px 0 0; padding:8px 0; color:var(--muted); font-size:12px; }
  .task-links { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .task-link { border:1px solid #dfe4fa; border-radius:7px; padding:3px 7px;
    background:#f7f8ff; color:#4056ad; font-size:11px; }
  .editor { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .weekdays { display:flex; flex-wrap:wrap; gap:6px 10px; border:0; padding:0; margin:0; }
  .weekdays legend { padding:0 0 3px; color:var(--ink-2); font-size:12px; }
  .weekdays label { flex-direction:row; align-items:center; gap:3px; color:var(--ink-2); }
  .details { margin-top:7px; color:var(--ink-2); font-size:12px; }
  .details summary { cursor:pointer; color:var(--muted); }
  .toast { position:fixed; right:18px; bottom:18px; max-width:340px; padding:10px 12px;
    border:1px solid #cbd3fa; border-radius:10px; background:#fff; box-shadow:0 8px 26px #2223;
    z-index:5; }
  .toast p { margin:4px 0; font-size:12px; }
  .toast-actions { display:flex; justify-content:flex-end; gap:8px; }
  @media (max-width:650px) {
    .shell { padding:16px 12px 40px; }
    .form-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="heading">
      <h1>自主活动与长期交代</h1>
      <div class="sub">定时唤醒、公开网页监听、活动记录与长期交代都保存在这个插件中。</div>
    </div>
    <div class="head-actions">
      <button id="go-ling" class="button primary" type="button">回到灵</button>
      <button id="refresh" class="button" type="button">刷新</button>
    </div>
  </header>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div class="tabs" role="tablist" aria-label="自主活动栏目">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="overview">概览</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="schedules">定时</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="watches">网站</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="runs">活动</button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="responsibilities">长期交代</button>
  </div>

  <div data-pane="overview">
    <div class="grid">
      <section class="section">
        <h2>设置</h2>
        <form id="settings-form" class="form-grid">
          <label class="check wide"><input id="enabled" type="checkbox"> 启用定时与监听</label>
          <p class="hint wide" style="grid-column:1/-1">新安装默认关闭。关闭自动活动不会停止已接收的唤醒或已开始的独立工作。</p>
          <label class="check"><input id="interval-enabled" type="checkbox"> 按固定间隔唤醒</label>
          <label>间隔（分钟）<input id="interval-minutes" type="number" min="1" step="1" value="60"></label>
          <label class="check"><input id="planning-enabled" type="checkbox"> 每日规划</label>
          <label>规划时间<input id="planning-time" type="time" value="09:00"></label>
          <label>网站检查间隔（分钟）<input id="watch-interval" type="number" min="1" step="1" value="5"></label>
          <div class="form-foot wide"><span id="settings-status" class="hint"></span><button class="button primary" type="submit">保存设置</button></div>
        </form>
      </section>
      <section class="section">
        <h2>当前状态</h2>
        <div id="summary" class="cards"></div>
      </section>
    </div>
  </div>

  <div data-pane="schedules" hidden>
    <section class="section">
      <h2>定时 <span id="schedule-count" class="count"></span></h2>
      <div id="schedules" class="cards"></div>
      <form id="schedule-form" class="editor form-grid" hidden>
        <label class="wide">标题<input id="schedule-title" type="text" maxlength="160" placeholder="例如：整理今天的邮件"></label>
        <label class="wide">交给灵的内容<textarea id="schedule-prompt" rows="3" placeholder="到时间后要完成或检查什么"></textarea></label>
        <label>重复<select id="schedule-kind"><option value="once">一次</option><option value="interval">固定间隔</option><option value="daily">每天</option><option value="weekly">每周</option></select></label>
        <label data-when="time">时间<input id="schedule-time" type="time" value="09:00"></label>
        <fieldset data-when="weekday" class="weekdays wide"><legend>星期（可多选）</legend></fieldset>
        <label data-when="interval">间隔（分钟）<input id="schedule-minutes" type="number" min="1" step="1" value="60"></label>
        <label data-when="once">日期时间<input id="schedule-due" type="datetime-local"></label>
        <label class="check wide"><input id="schedule-notify" type="checkbox"> 到点后明确提醒我</label>
        <p id="schedule-error" class="hint wide"></p>
        <div class="form-foot wide"><button id="schedule-cancel" class="button" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
      <div class="form-foot"><button id="schedule-add" class="button primary" type="button">＋ 新建定时</button></div>
    </section>
  </div>

  <div data-pane="watches" hidden>
    <section class="section">
      <h2>网站 <span id="watch-count" class="count"></span></h2>
      <div id="watches" class="cards"></div>
      <form id="watch-form" class="editor form-grid" hidden>
        <label class="wide">网址<input id="watch-url" type="url" placeholder="https://example.com"></label>
        <label class="wide">标题<input id="watch-title" type="text" maxlength="160" placeholder="可留空"></label>
        <label>检查间隔（分钟）<input id="watch-minutes" type="number" min="1" step="1" value="5"></label>
        <p id="watch-error" class="hint wide"></p>
        <div class="form-foot wide"><button id="watch-cancel" class="button" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
      <div class="form-foot"><button id="watch-add" class="button primary" type="button">＋ 新建网站监听</button></div>
    </section>
  </div>

  <div data-pane="runs" hidden>
    <section class="section">
      <h2>活动 <span id="run-count" class="count"></span></h2>
      <div id="runs" class="cards"></div>
    </section>
  </div>

  <div data-pane="responsibilities" hidden>
    <section class="section">
      <h2>长期交代 <span id="responsibility-count" class="count"></span></h2>
      <div id="responsibilities" class="cards"></div>
      <form id="responsibility-form" class="editor form-grid" hidden>
        <label class="wide">标题<input id="responsibility-title" type="text" maxlength="160" required></label>
        <label class="wide">说明<textarea id="responsibility-instruction" rows="3" maxlength="20000" required></textarea></label>
        <label class="wide">进展（可选）<textarea id="responsibility-summary" rows="2" maxlength="8000"></textarea></label>
        <p id="responsibility-error" class="hint wide"></p>
        <div class="form-foot wide"><button id="responsibility-cancel" class="button" type="button">取消</button><button class="button primary" type="submit">保存</button></div>
      </form>
      <div class="form-foot"><button id="responsibility-add" class="button primary" type="button">＋ 新建长期交代</button></div>
    </section>
  </div>
</div>

<aside id="toast" class="toast" hidden aria-live="polite">
  <p id="toast-text"></p>
  <div class="toast-actions"><button id="toast-close" class="button" type="button">关闭</button><button id="toast-runs" class="button primary" type="button">查看活动</button></div>
</aside>

<script src="app.js"></script>
</body>
</html>
