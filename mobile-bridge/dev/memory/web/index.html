<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆</title>
<link rel="stylesheet" href="/css/plugin-ui.css"><script src="/js/plugin-ui.js"></script><link rel="stylesheet" href="style.css"></head>
<body data-nexus-plugin><main class="plugin-page">
<header class="header"><div><h1>记忆</h1><p class="intro">把交流沉淀为主题级记忆，在需要时回想。</p></div><span class="badge">0.1.0</span></header>
<div id="notice" class="message" role="status" aria-live="polite"></div>
<section class="card"><div class="section-head"><h2>状态</h2><button class="btn ghost" id="refresh">刷新</button></div><p id="summary" class="help">正在读取…</p><p class="help">仅采集首次启用后的完整消息。删除交流上下文不会删除已保存的记忆和原文。</p><div class="actions"><button class="btn solid" data-action="collect">立即采集</button><button class="btn ghost" data-action="process">立即处理</button><button class="btn ghost" data-action="embedding.retry">补建失败向量</button><button class="btn ghost" id="reindex">重建全部索引</button><button class="btn ghost" id="cleanup">清理无引用原文</button></div></section>
<section class="card"><div class="section-head"><h2>记忆粒子</h2><span id="count" class="badge"></span></div>
<form id="search" class="search"><label class="field grow">搜索记忆<input id="query" placeholder="例如：之前决定怎样处理原文？"></label><label class="field">方式<select id="mode"><option value="semantic">语义检索</option><option value="exact">精确检索</option></select></label><label class="field small">最多条数<input id="limit" type="number" min="1" max="100" value="10"></label><button class="btn solid" type="submit">检索</button><button class="btn ghost" type="button" id="browse">查看全部</button></form>
<div id="particles" aria-live="polite"></div><div class="actions"><button class="btn ghost" id="prev">上一页</button><span id="page" class="help"></span><button class="btn ghost" id="next">下一页</button></div></section>
<section class="card"><div class="section-head"><h2>处理队列</h2></div><div id="batches"></div></section>
<section class="card"><div class="section-head"><h2>配置</h2><span class="help">采集和处理计划独立；云端模型单独配置。</span></div><form id="settings"><div id="fields" class="fields"></div><div class="actions"><button type="submit" class="btn solid">保存配置</button><button type="button" class="btn ghost" id="reload-settings">重新读取</button></div><p class="help">地址填写到 /v1 或完整接口路径。密钥留空不修改，勾选清除才会移除。每天定时和事件时间按所选时区解释。相似度门槛是初始值，需按实际模型效果调整。</p></form></section>
<dialog id="editor"><form id="edit-form"><div class="section-head"><h2>修订记忆</h2><button type="button" class="btn ghost" data-close="editor">关闭</button></div><p class="help">保留原文与来源，修改后标记人工修订，并重新生成向量。</p><label class="field">正文<textarea id="edit-content" rows="9" required></textarea></label><div class="fields"><label class="field">事件开始<input id="edit-start" type="datetime-local"></label><label class="field">事件结束<input id="edit-end" type="datetime-local"></label></div><p id="edit-error" class="message error" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-close="editor">取消</button><button class="btn solid" type="submit">保存修订</button></div></form></dialog>
<dialog id="original"><div class="section-head"><h2>绑定原文</h2><button class="btn ghost" data-close="original">关闭</button></div><div id="original-body"></div></dialog>
<dialog id="confirmation"><h2>确认操作</h2><p id="confirmation-text"></p><div class="actions"><button class="btn ghost" type="button" id="confirm-no">取消</button><button class="btn solid" type="button" id="confirm-yes">确认</button></div></dialog>
</main><script src="app.js"></script></body></html>
