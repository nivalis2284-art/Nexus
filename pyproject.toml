[project]
name = "nexus"
version = "0.1.0"
description = "A minimal coding agent"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.8,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-timeout>=2,<3", "ruff>=0.6,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["web/*.html", "web/*.css", "web/*.js", "web/css/*.css", "web/js/*.js", "web/assets/*", "web/vendor/*", "builtin_skills/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 单条用例最多 90 秒：卡住的用例会被中断并打印栈，不会拖死整轮。
addopts = "--timeout=90 --timeout-method=thread"

[tool.ruff]
target-version = "py312"
line-length = 100
