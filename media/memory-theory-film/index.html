<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>面向持续个体的情境化长期记忆 · LingNexus 理论短片</title>
<style>
  :root {
    --bg: #04060d;
    --ink: #e8eef8;
    --dim: #8291aa;
    --cyan: #5ee7ff;
    --gold: #ffce70;
    --panel: rgba(8, 13, 26, 0.82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #020308; color: var(--ink);
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  #stage-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, #090d1c 0%, #020308 100%);
  }
  #gl-canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    box-shadow: 0 24px 90px rgba(0, 0, 0, 0.85), 0 0 1px rgba(94, 231, 255, 0.25);
  }
  #src-canvas { display: none; }

  /* 首次进入的序幕覆盖门 */
  #gate {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 46%, rgba(14, 22, 44, 0.92), rgba(3, 5, 11, 0.97));
    backdrop-filter: blur(12px);
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-eyebrow {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px; letter-spacing: 5px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 18px; opacity: 0.9;
  }
  .gate-title {
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    font-size: clamp(28px, 3.6vw, 54px); font-weight: 500;
    letter-spacing: 6px; color: var(--ink); margin-bottom: 14px;
    text-align: center; padding: 0 24px;
  }
  .gate-sub {
    font-size: clamp(14px, 1.3vw, 18px); color: var(--dim);
    letter-spacing: 3px; margin-bottom: 44px; text-align: center;
  }
  .gate-btn {
    position: relative;
    padding: 15px 44px; border-radius: 999px;
    border: 1px solid rgba(94, 231, 255, 0.55);
    background: rgba(14, 26, 48, 0.7);
    color: var(--ink); font-size: 16px; letter-spacing: 4px;
    cursor: pointer; transition: all 0.28s ease;
    box-shadow: 0 0 36px rgba(94, 231, 255, 0.16), inset 0 0 18px rgba(94, 231, 255, 0.08);
  }
  .gate-btn:hover {
    border-color: var(--gold); color: #fff;
    box-shadow: 0 0 48px rgba(255, 206, 112, 0.3), inset 0 0 22px rgba(255, 206, 112, 0.14);
    transform: translateY(-1px);
  }
  .gate-note {
    margin-top: 26px; font-size: 12px; color: rgba(130, 145, 170, 0.72);
    letter-spacing: 1.5px;
  }

  /* 底部控制栏 */
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 18px 28px 16px;
    background: linear-gradient(to top, rgba(2, 4, 10, 0.92) 0%, rgba(2, 4, 10, 0.55) 60%, transparent 100%);
    opacity: 0; transition: opacity 0.35s ease;
  }
  body:hover #hud, #hud.pinned { opacity: 1; }
  .bar-row {
    display: flex; align-items: center; gap: 14px;
  }
  .ctrl-btn {
    background: rgba(16, 25, 46, 0.75);
    border: 1px solid rgba(130, 145, 170, 0.3);
    color: var(--ink); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; letter-spacing: 1.5px;
    cursor: pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { border-color: var(--cyan); color: #fff; }
  #time-label {
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 13px; color: var(--dim); min-width: 112px;
  }
  #scene-label {
    font-size: 13px; color: var(--gold); letter-spacing: 2px;
    min-width: 180px;
  }
  #scrub {
    position: relative; flex: 1; height: 22px;
    display: flex; align-items: center; cursor: pointer;
  }
  .scrub-track {
    position: relative; width: 100%; height: 4px;
    background: rgba(130, 145, 170, 0.22); border-radius: 2px;
    overflow: visible;
  }
  #scrub-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--gold));
    border-radius: 2px; position: relative;
  }
  .tick {
    position: absolute; top: -3px; width: 1px; height: 10px;
    background: rgba(232, 238, 248, 0.28);
  }
  .tick:hover::after {
    content: attr(data-title);
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 11px; padding: 3px 8px;
    background: var(--panel); border: 1px solid rgba(94, 231, 255, 0.35);
    border-radius: 4px; color: var(--ink);
  }
  .chapters {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .chap-pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(130, 145, 170, 0.22);
    background: rgba(10, 16, 30, 0.65); color: var(--dim);
    cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
  }
  .chap-pill:hover, .chap-pill.active {
    border-color: var(--cyan); color: var(--ink);
    background: rgba(94, 231, 255, 0.14);
  }

  /* 捕获模式：隐藏一切 UI，画布固定 1920x1080 */
  body.capture #gate, body.capture #hud { display: none !important; }
  body.capture #gl-canvas { width: 1920px !important; height: 1080px !important; box-shadow: none !important; }
</style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="src-canvas" width="1920" height="1080"></canvas>
    <canvas id="gl-canvas" width="1920" height="1080"></canvas>
  </div>

  <div id="gate">
    <div class="gate-eyebrow">LingNexus · Theory Film · 2026</div>
    <h1 class="gate-title">面向持续个体的情境化长期记忆</h1>
    <div class="gate-sub">背景概览 · 事件联想 · 可修订认识 · 最终呈现形态（含实时合成配乐与音效）</div>
    <button class="gate-btn" id="start-btn">▶ 播放全片（03:45）</button>
    <div class="gate-note">建议佩戴耳机 · 空格暂停/继续 · 方向键快进/后退 · 点击底部章节可任意跳转</div>
  </div>

  <div id="hud" class="pinned">
    <div class="bar-row">
      <button class="ctrl-btn" id="play-btn">播放</button>
      <span id="time-label">00:00 / 03:45</span>
      <div id="scrub">
        <div class="scrub-track" id="scrub-track">
          <div id="scrub-fill"></div>
        </div>
      </div>
      <span id="scene-label">00 · 序幕</span>
      <button class="ctrl-btn" id="fs-btn">全屏</button>
    </div>
    <div class="chapters" id="chapters"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/world.js"></script>
  <script src="js/post.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script>
    (function () {
      const M = window.MF;
      const params = new URLSearchParams(location.search);
      const isCapture = params.has('capture');
      if (isCapture) document.body.classList.add('capture');

      const srcCanvas = document.getElementById('src-canvas');
      const glCanvas = document.getElementById('gl-canvas');
      const ctx = srcCanvas.getContext('2d');
      const post = new M.Post(glCanvas, srcCanvas, isCapture);

      let curT = 0;
      let playing = false;
      let rafId = 0;
      let wallT0 = 0;
      let posT0 = 0;

      function fmt(sec) {
        sec = Math.max(0, Math.min(M.DURATION, sec));
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function sceneAt(t) {
        let idx = 0;
        for (let i = 0; i < M.SCENES.length; i++) {
          if (t >= M.SCENES[i].t0) idx = i;
        }
        return idx;
      }

      // 构建章节条与刻度
      const track = document.getElementById('scrub-track');
      const chaps = document.getElementById('chapters');
      const pills = [];
      M.SCENES.forEach((sc, i) => {
        if (i > 0) {
          const tick = document.createElement('div');
          tick.className = 'tick';
          tick.style.left = ((sc.t0 / M.DURATION) * 100).toFixed(3) + '%';
          tick.dataset.title = `${String(i).padStart(2, '0')} · ${sc.title}`;
          track.appendChild(tick);
        }
        const pill = document.createElement('button');
        pill.className = 'chap-pill';
        pill.textContent = i === 0 ? '00 · 序幕' : `${String(i).padStart(2, '0')} · ${sc.title}`;
        pill.addEventListener('click', () => seek(sc.t0));
        chaps.appendChild(pill);
        pills.push(pill);
      });

      const fillEl = document.getElementById('scrub-fill');
      const timeEl = document.getElementById('time-label');
      const sceneEl = document.getElementById('scene-label');
      const playBtn = document.getElementById('play-btn');
      const hud = document.getElementById('hud');

      function updateHUD(t) {
        fillEl.style.width = ((t / M.DURATION) * 100).toFixed(3) + '%';
        timeEl.textContent = `${fmt(t)} / ${fmt(M.DURATION)}`;
        const si = sceneAt(t);
        const sc = M.SCENES[si];
        sceneEl.textContent = si === 0 ? '00 · 序幕' : `${String(si).padStart(2, '0')} · ${sc.title}`;
        pills.forEach((p, idx) => p.classList.toggle('active', idx === si));
      }

      function renderAt(t) {
        curT = Math.max(0, Math.min(M.DURATION, t));
        const u = M.render(ctx, curT);
        post.render(u);
        if (!isCapture) updateHUD(curT);
      }

      function loop() {
        if (!playing) return;
        const at = M.Audio.time();
        const t = at !== null ? at : posT0 + (performance.now() - wallT0) / 1000;
        if (t >= M.DURATION) {
          renderAt(M.DURATION);
          pause();
          return;
        }
        renderAt(t);
        rafId = requestAnimationFrame(loop);
      }

      function play(fromT) {
        if (typeof fromT === 'number') curT = fromT;
        if (curT >= M.DURATION - 0.1) curT = 0;
        document.getElementById('gate').classList.add('hidden');
        hud.classList.remove('pinned');
        playing = true;
        playBtn.textContent = '暂停';
        posT0 = curT;
        wallT0 = performance.now();
        M.Audio.start(curT);
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(loop);
      }

      function pause() {
        playing = false;
        playBtn.textContent = '播放';
        hud.classList.add('pinned');
        M.Audio.stop();
        cancelAnimationFrame(rafId);
      }

      function seek(t) {
        curT = Math.max(0, Math.min(M.DURATION, t));
        renderAt(curT);
        if (playing) {
          posT0 = curT;
          wallT0 = performance.now();
          M.Audio.start(curT);
        }
      }

      document.getElementById('start-btn').addEventListener('click', () => play(0));
      playBtn.addEventListener('click', () => (playing ? pause() : play(curT)));
      document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      });

      const scrub = document.getElementById('scrub');
      let dragging = false;
      function scrubEvent(e) {
        const rect = track.getBoundingClientRect();
        const k = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        seek(k * M.DURATION);
      }
      scrub.addEventListener('mousedown', (e) => { dragging = true; scrubEvent(e); });
      window.addEventListener('mousemove', (e) => { if (dragging) scrubEvent(e); });
      window.addEventListener('mouseup', () => { dragging = false; });

      window.addEventListener('keydown', (e) => {
        if (isCapture) return;
        if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(curT); }
        else if (e.code === 'ArrowRight') { e.preventDefault(); seek(curT + 5); }
        else if (e.code === 'ArrowLeft') { e.preventDefault(); seek(curT - 5); }
      });

      // 暴露给 Puppeteer 离线帧捕获与音频渲染
      window.__renderAt = renderAt;
      window.__ready = false;
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
        renderAt(isCapture ? 0 : 4.8);
        window.__ready = true;
      });
    })();
  </script>
</body>
</html>
